{% extends "base.html" %}{% block content %}
<div class="auth-wrap"><div class="auth-card">
<h3 class="mb-1">Smart Campus</h3><p class="text-muted">Sign in to continue</p>
<form method="post">
 <div class="btn-group w-100 mb-3">
  <input type="radio" class="btn-check" name="role" id="r1" value="student" checked><label class="btn btn-outline-primary" for="r1">Student</label>
  <input type="radio" class="btn-check" name="role" id="r2" value="admin"><label class="btn btn-outline-primary" for="r2">Admin</label>
 </div>
 <input class="form-control mb-3" type="email" name="email" placeholder="Email" required>
 <input class="form-control mb-3" type="password" name="password" placeholder="Password" required>
 <button class="btn btn-primary w-100">Login</button>
</form>
<p class="mt-3 mb-0 text-center">New student? <a href="{{ url_for('register') }}">Register</a></p>
</div></div>{% endblock %}
