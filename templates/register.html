{% extends "base.html" %}{% block content %}
<div class="auth-wrap"><div class="auth-card">
<h3 class="mb-3">Student Registration</h3>
<form method="post">
 <input class="form-control mb-2" name="name" placeholder="Full name" required>
 <input class="form-control mb-2" type="email" name="email" placeholder="Email" required>
 <input class="form-control mb-2" name="roll_no" placeholder="Roll number" required>
 <input class="form-control mb-2" name="department" placeholder="Department" required>
 <input class="form-control mb-2" name="phone" placeholder="Phone (optional)">
 <input class="form-control mb-2" type="password" name="password" placeholder="Password (min 6)" required>
 <input class="form-control mb-3" type="password" name="confirm" placeholder="Confirm password" required>
 <button class="btn btn-primary w-100">Register</button>
</form>
<p class="mt-3 mb-0 text-center">Have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div></div>{% endblock %}
